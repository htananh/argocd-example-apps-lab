apiVersion: batch/v1
kind: Job
metadata:
  name: db-check-job
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: busybox
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: host
          command:
            - 'sh'
            - '-c'
            - "echo \"Checking DB connectivity to $DB_HOST...\"; sleep 5; echo 'DB check passed!'"
